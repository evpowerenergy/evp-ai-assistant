# Mount/copy this as /opt/data/config.yaml after completing provider setup.
model:
  default: "gpt-5.6-luna"
  provider: "openai-api"
  base_url: "https://api.openai.com/v1"

agent:
  reasoning_effort: high

mcp_servers:
  evp:
    url: "http://evp-mcp-gateway:8001/mcp"
    timeout: 60
    connect_timeout: 10
    supports_parallel_tool_calls: false
    tools:
      include:
        - get_daily_summary
        - search_leads
        - get_sales_closed
        - get_sales_unsuccessful
        - get_marketing_dashboard
        - search_knowledge
        - get_sales_team_overview
        - get_sales_team_list
        - get_sales_performance
        - get_appointments
        - get_lead_detail
        - get_sales_docs
      resources: false
      prompts: false
